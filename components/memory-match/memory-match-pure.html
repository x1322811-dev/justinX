<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>记忆配对消消乐</title>
  <link rel="stylesheet" href="../shared/shared.css">
  <link rel="stylesheet" href="../shared/variables-tn.css">
  <link rel="stylesheet" href="./memory-match.css">
</head>

<body>
  <main>
    <div class="memory-match-content content-container">
      <!-- 提示区域容器 - 固定高度避免跳动 -->
      <div class="hint-container">
        <!-- 游戏规则提示 -->
        <div class="game-rule-hint" id="gameRuleHint">
          记住卡片的位置 找出所有相同的卡片
        </div>

        <!-- 记忆阶段倒计时模块 -->
        <div class="memory-countdown-module" id="memoryCountdownModule">
          <div class="memory-countdown-text">记住卡片的位置</div>
          <div class="memory-progress-bar">
            <div class="memory-progress-fill" id="memoryProgressFill"></div>
          </div>
        </div>

        <!-- 配对阶段倒计时模块 -->
        <div class="play-countdown-module" id="playCountdownModule">
          <div class="play-countdown-display">
            <!-- 十秒位 - 滚动 -->
            <div class="time-digit-group">
              <div class="digit-roller" id="digitTens">
                <div class="digit-track"></div>
              </div>
            </div>
            <!-- 秒位 - 滚动 -->
            <div class="time-digit-group">
              <div class="digit-roller" id="digitOnes">
                <div class="digit-track"></div>
              </div>
            </div>
            <div class="time-separator">:</div>
            <!-- 0.1秒位 - 原地变换 -->
            <div class="time-digit-group static">
              <div class="digit-static" id="digitTenths">0</div>
            </div>
            <!-- 0.01秒位 - 原地变换 -->
            <div class="time-digit-group static">
              <div class="digit-static" id="digitHundredths">0</div>
            </div>
          </div>
        </div>

        <!-- 通关提示模块 -->
        <div class="level-complete-hint" id="levelCompleteHint">
          恭喜你，通过第1关！
        </div>
      </div>

      <!-- 游戏主容器 - 包含状态栏、提示、卡片区域 -->
      <div class="game-main-container">
        <!-- 游戏状态栏 -->
        <div class="game-status-bar" id="gameStatusBar" style="display: none;">
          <div class="status-item">
            <span class="status-text" id="currentLevel">关卡 1</span>
          </div>
          <div class="status-item">
            <span class="status-text" id="gameHint">记忆阶段</span>
          </div>
          <div class="status-item">
            <span class="status-text highlight" id="remainingTime">剩余时间 20s</span>
          </div>
        </div>

        <!-- 卡片网格区域 -->
        <div class="card-grid" id="cardGrid">
          <!-- 卡片将通过JavaScript动态生成 -->
        </div>
      </div>

      <!-- 操作按钮区 -->
      <div class="button-group">
        <button class="btn btn-primary" id="startBtn">
          开始挑战
        </button>
        <button class="btn btn-primary-dark" id="skipMemoryBtn" style="display: none;">
          直接开始
        </button>
      </div>

      <!-- 内联结果面板将通过JavaScript动态插入到这里 -->
    </div>
  </main>

  <script src="./memory-match.js"></script>
</body>
</html>
